[package]
name = "storage-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
crc32fast = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# dev-only: SQLite baseline for the comparison benchmark (bundled, no system dep).
rusqlite = { version = "0.31", features = ["bundled"] }

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "compare"
harness = false